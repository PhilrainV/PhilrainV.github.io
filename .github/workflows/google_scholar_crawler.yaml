name: Sync Citation Data

on:
  page_build:
  schedule:
    - cron: "5 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Download canonical citation data
        run: |
          mkdir -p results
          base_url="https://raw.githubusercontent.com/PhilrainV/YuangWei_EN/google-scholar-stats"
          curl --fail --silent --show-error --location "${base_url}/gs_data.json" --output results/gs_data.json
          curl --fail --silent --show-error --location "${base_url}/gs_data_shieldsio.json" --output results/gs_data_shieldsio.json

      - name: Publish mirrored data
        run: |
          cd results
          git init
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.json
          git commit -m "Sync Citation Data"
          git push "https://${GITHUB_ACTOR}:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:google-scholar-stats --force
